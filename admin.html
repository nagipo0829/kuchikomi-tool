<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店舗QR発行</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--y:#FFD400;--k:#111;--g:#f2f2f2}
body{margin:0;font-family:'Noto Sans JP',sans-serif;background:var(--g);color:var(--k)}
header{background:var(--k);color:var(--y);padding:14px 16px;font-weight:900}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
input{width:100%;font:inherit;padding:10px;border:2px solid #ddd;border-radius:10px;box-sizing:border-box}
small{color:#888;font-size:12px;line-height:1.6;display:block;margin-top:4px}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--y);font:inherit;font-weight:900;font-size:16px;cursor:pointer}
#qr{display:flex;justify-content:center;padding:12px}
#link{word-break:break-all;font-size:12px}
</style>
</head>
<body>
<header>店舗ごとのQRコード発行</header>
<main>
<div class="card">
  <label>店舗名</label><input id="name" value="サンプル食堂">
  <label>GoogleのPlace ID（口コミ画面に直接飛ぶために使用）</label><input id="pid" placeholder="例：ChIJxxxxxxxx">
  <small>Google「Place ID Finder」で店名を検索すると取得できます。空欄だとGoogleマップのトップに飛びます。</small>
  <label>メニュー・利用内容（カンマ区切り）</label><input id="items" value="定食,ラーメン,ドリンク">
  <label>追加の「よかった点」（カンマ区切り）</label><input id="pts" value="">
  <small>dart（ダーツが楽しめた）／beginner（初心者に優しい）／solo（一人でも入りやすい）／group（団体OK）</small>
  <button id="make">QRコードを作る</button>
</div>
<div class="card" id="res" style="display:none">
  <div id="qr"></div>
  <p id="link"></p>
  <a id="open" target="_blank">▶ お客さん画面を開いて確認</a>
  <small>QRを右クリック→画像を保存して、POPやテーブルに貼ってください。公開するときは、index.htmlを置いたWebのURLに自動で切り替わります。</small>
</div>
</main>
<script>
document.getElementById('make').onclick = () => {
  const q = new URLSearchParams({
    name: document.getElementById('name').value,
    pid: document.getElementById('pid').value,
    items: document.getElementById('items').value,
    pts: document.getElementById('pts').value
  });
  const base = location.href.replace(/admin\.html.*$/, 'index.html');
  const url = base + '?' + q.toString();
  document.getElementById('qr').innerHTML = '';
  new QRCode(document.getElementById('qr'), {text:url, width:220, height:220});
  document.getElementById('link').textContent = url;
  document.getElementById('open').href = url;
  document.getElementById('res').style.display = 'block';
};
</script>
</body>
</html>
